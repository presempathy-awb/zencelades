# Same tool versions as the existing Erebe/Much Ado module toolchain.
# This file pins tools; it does not install them.
[settings]
# Keep child shells on the same pinned tools as mise exec.
activate_aggressive = true

[tools]
python = "3.14.7"
uv = "0.12.17"
just = "1.58.0"
bun = "1.4.2"
jj = "0.45.1"
ruff = "0.16.3"
gitleaks = "8.30.1"
trivy = "0.74.0"
go = "1.26.5"
