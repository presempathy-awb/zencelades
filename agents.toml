# Repository context only; no generated output ownership is declared.
[meta]
schema = "agents.core.v1"
project = "zencelades"
generated = false

[project]
name = "zencelades"
canonical_forge = "https://git.telpher.stream/telpher/zencelades"
stack = "python"
description = "Zencelades: the Enceladus Within artwork, preserved assets, grant research and 3D design studio. Legacy storage/service IDs remain thatsnozorb."
