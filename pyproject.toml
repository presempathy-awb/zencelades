[project]
license = "MIT OR Apache-2.0"
name = "thatsnozorb"
version = "0.1.0"
description = "Enceladus Within project record and asset ingestion"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["unit: isolated tests with no external services"]

[tool.ruff]
target-version = "py312"
# scripts/license_gaps.py is the licensing kit's text, written byte for byte by legal-index's
# oss_setup.py update and checked there; formatting it here would make the next update refuse it.
extend-exclude = ["scripts/license_gaps.py"]
