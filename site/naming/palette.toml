purpose = "Explore a new name for the provisional thatsnomoon/thatsnozorb art project: a playful spherical projection that moves between human presence and Saturn's ocean moon Enceladus. Bridge Love Burn, ice fissures and water plumes, hidden oceans, moon phases, Saturn and its rings, transparent zorbs, light projection, refraction and caustics, morphing, bodily movement, water and communal delight. Names describe the artistic vision; they make no claim of built hardware or approved occupancy."
author = "Codex; authored before generation after reading the project files; project-local categories for this roll"

