# Proposed canonical-domain provider. Keep deploy/authentik.toml's old host intact.
# Apply only through Telpher after checking application access policy.
[defaults]
provider_mode_api = "forward_single"
authorization_flow_slug = "default-provider-authorization-implicit-consent"
invalidation_flow_slug = "default-provider-invalidation-flow"
outpost_authentik_host = "https://authentik.telpher.stream"

[applications.zenceladus]
name = "Zencelades personal drafts"
slug = "zenceladus"
route_host = "zenceladus.com"
external_host = "https://zenceladus.com"
launch_url = "https://zenceladus.com/"
provider_name = "zenceladus-forward-auth"
