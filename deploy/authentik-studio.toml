# Apply through Telpher, restrict membership, then publish the gated hostname.
[defaults]
provider_mode_api = "forward_single"
authorization_flow_slug = "default-provider-authorization-implicit-consent"
invalidation_flow_slug = "default-provider-invalidation-flow"
outpost_authentik_host = "https://authentik.telpher.stream"

[applications.zenceladus-studio]
name = "Zencelades private asset studio"
slug = "zenceladus-studio"
route_host = "studio.zenceladus.com"
external_host = "https://studio.zenceladus.com"
launch_url = "https://studio.zenceladus.com/"
provider_name = "zenceladus-studio-forward-auth"
