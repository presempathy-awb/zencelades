# P009 proposed broker policy addition. No runtime authorization is granted here.
# Requires the complete hesellsheshells publisher PR #65 implementation and
# top-level policy version = 2. Do not append to a version-1 policy or deploy
# separately from that broker build: older brokers do not enforce write_refs.
# The owner policy-check derives the secret and environment binding from this name.
[principals.thatsnozorb-publisher]
description = "Thatsnozorb research and original-file preservation."
auth = ["token"]
groups = ["lake-writers"]
repos = ["thatsnozorb-assets"]
prefixes = ["imports/*"]
write_refs = ["ingest-*"]
